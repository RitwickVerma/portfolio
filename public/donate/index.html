<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Ritwick Verma — open source</title>
<meta name="description" content="Support the open-source work of Ritwick Verma. One-off or recurring, no account, no trackers.">
<meta name="color-scheme" content="dark light">
<meta property="og:type" content="website">
<meta property="og:title" content="Support Ritwick Verma — open source">
<meta property="og:description" content="Fund the open-source software I maintain. Pick whichever channel you already use.">
<meta property="og:image" content="https://ritwickverma.github.io/donate/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>☕</text></svg>">
<!-- Deliberately no external requests: no CDN, no fonts, no analytics, no cookies. -->
<style>
  :root {
    --bg:#0b0d12; --bg2:#11141c; --card:#151923; --card2:#1b2030;
    --fg:#e8ecf4; --muted:#8d98ad; --line:#242a38;
    --accent:#7c8cff; --accent2:#ff7cc3; --accent3:#ffcf7c;
    --radius:16px;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  html[data-theme="light"] {
    --bg:#fbfbfd; --bg2:#f3f4f8; --card:#ffffff; --card2:#f7f8fc;
    --fg:#141824; --muted:#5b6478; --line:#e4e7ef;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 12px 32px -14px rgba(16,24,40,.18);
  }
  @media (prefers-color-scheme: light) {
    html[data-theme="auto"] {
      --bg:#fbfbfd; --bg2:#f3f4f8; --card:#ffffff; --card2:#f7f8fc;
      --fg:#141824; --muted:#5b6478; --line:#e4e7ef;
      --shadow:0 1px 2px rgba(16,24,40,.06), 0 12px 32px -14px rgba(16,24,40,.18);
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.6 ui-sans-serif,System,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(60rem 40rem at 50% -10%, color-mix(in oklab, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(40rem 30rem at 90% 10%, color-mix(in oklab, var(--accent2) 12%, transparent), transparent 60%);
    background-attachment:fixed;
  }
  .wrap { max-width:960px; margin:0 auto; padding:clamp(20px,5vw,64px) clamp(16px,4vw,28px) 80px; }

  /* ---------- hero ---------- */
  header.hero { text-align:center; padding:28px 0 8px; }
  .avatar {
    width:104px; height:104px; margin:0 auto 22px; border-radius:50%;
    display:grid; place-items:center; font-size:48px; line-height:1;
    background:linear-gradient(145deg, var(--card2), var(--card));
    border:1px solid var(--line); box-shadow:var(--shadow);
    animation:float 6s var(--ease) infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  h1 { font-size:clamp(28px,5vw,44px); line-height:1.1; margin:0 0 14px; letter-spacing:-.02em; }
  h1 .grad {
    background:linear-gradient(100deg,var(--accent),var(--accent2) 55%,var(--accent3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lede { color:var(--muted); font-size:clamp(15px,2.2vw,18px); max-width:60ch; margin:0 auto 26px; }
  .cta-row { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:8px; }
  .btn {
    display:inline-flex; align-items:center; gap:9px; text-decoration:none;
    padding:12px 20px; border-radius:999px; font-weight:600; font-size:15px;
    border:1px solid var(--line); background:var(--card); color:var(--fg);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
  }
  .btn:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:color-mix(in oklab,var(--accent) 50%, var(--line)); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .btn.primary { background:linear-gradient(100deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; }
  .hint { color:var(--muted); font-size:13px; margin-top:14px; }

  /* ---------- sections ---------- */
  section { margin-top:56px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin:0 0 18px; font-weight:600; }
  .grid { display:grid; gap:14px; }
  .grid.cols-3 { grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
  .grid.cols-4 { grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }

  .card {
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow);
    transition:transform .2s var(--ease), border-color .2s var(--ease);
  }
  .card:hover { transform:translateY(-3px); border-color:color-mix(in oklab,var(--accent) 40%, var(--line)); }
  .card .icon { font-size:22px; display:block; margin-bottom:10px; }
  .card h3 { margin:0 0 6px; font-size:16px; }
  .card p { margin:0; color:var(--muted); font-size:14px; }

  /* tiers */
  .tier { text-align:center; display:flex; flex-direction:column; }
  .tier .amt { font-size:26px; font-weight:700; letter-spacing:-.02em; margin:6px 0 2px; }
  .tier .per { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.1em; }
  .tier .what { color:var(--muted); font-size:13.5px; margin:10px 0 16px; flex:1; }
  .tier a { margin-top:auto; justify-content:center; }

  /* channels */
  .chan-grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .chan {
    display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; transition:transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .chan:hover { transform:translateY(-2px); border-color:color-mix(in oklab,var(--accent) 50%, var(--line)); box-shadow:var(--shadow); }
  .chan:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .chan .dot { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; flex:0 0 auto;
               background:var(--card2); border:1px solid var(--line); font-size:18px; }
  .chan .meta { min-width:0; }
  .chan .meta b { display:block; font-size:15px; }
  .chan .meta span { color:var(--muted); font-size:12.5px; }
  .chan .fee { margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap;
               border:1px solid var(--line); border-radius:999px; padding:3px 9px; }

  /* supporters */
  .wall { display:flex; flex-wrap:wrap; gap:8px; }
  .wall span {
    font-size:13px; padding:6px 12px; border-radius:999px;
    background:var(--card); border:1px solid var(--line); color:var(--muted);
  }
  .empty { color:var(--muted); font-size:14px; font-style:italic; }

  footer { margin-top:64px; padding-top:22px; border-top:1px solid var(--line);
           color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; }
  footer a { color:var(--muted); }

  /* reveal on scroll */
  .reveal { opacity:0; transform:translateY(14px); }
  .reveal.in { opacity:1; transform:none; transition:opacity .6s var(--ease), transform .6s var(--ease); }
  @media (prefers-reduced-motion: reduce) {
    .avatar { animation:none; }
    .reveal, .reveal.in { opacity:1; transform:none; transition:none; }
    .btn:hover, .card:hover, .chan:hover { transform:none; }
  }
  .setup { border:1px dashed var(--line); border-radius:var(--radius); padding:18px;
           color:var(--muted); font-size:14px; background:var(--card2); }
  code { background:var(--card2); border:1px solid var(--line); padding:1px 6px; border-radius:6px; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="avatar" aria-hidden="true">☕</div>
    <h1>Support <span class="grad" id="who">my</span> open source</h1>
    <p class="lede" id="lede"></p>
    <div class="cta-row" id="cta"></div>
    <p class="hint" id="hint"></p>
  </header>

  <section class="reveal">
    <h2>Where it goes</h2>
    <div class="grid cols-3" id="funds"></div>
  </section>

  <section class="reveal">
    <h2>Pick a size</h2>
    <div class="grid cols-4" id="tiers"></div>
  </section>

  <section class="reveal">
    <h2>Channels</h2>
    <div class="chan-grid" id="channels"></div>
    <div class="setup" id="setup" hidden></div>
  </section>

  <section class="reveal">
    <h2>Supporters</h2>
    <div class="wall" id="wall"></div>
  </section>

  <footer>
    <span id="privacy"></span>
    <span><a href="#" id="home">← back to projects</a></span>
  </footer>
</div>

<script>
/* ============================================================================
   EDIT THIS BLOCK ONLY. Anything left as "" is hidden automatically, so you can
   ship the page before you finish setting up every channel.
   ============================================================================ */
const CONFIG = {
  name: "Ritwick Verma",
  // Shown after "Support <name>'s open source": keep it one honest sentence.
  lede: "I build and maintain open-source tools in my own time — desktop effects, homelab plumbing, and small utilities. If something I made saved you an afternoon, this is how you can say thanks.",
  hint: "One-off or recurring. No account needed on this page, and nothing here tracks you.",

  // Fill in whichever you set up. Empty string = the button/wall entry is not rendered.
  // VERIFIED 2026-09-30: github.com/sponsors/RitwickVerma returns 302 (no listing yet), so
  // linking it now would put a DEAD link on a public page. Fill these in as accounts go live;
  // anything left as "" stays hidden, and the page degrades to the email CTA below.
  links: {
    sponsors:  "",                                        // 0% platform fee for individuals
    kofi:      "",                                        // 0% platform fee, instant to set up
    liberapay: "",                                        // 0% fees, recurring only
    stripe:    "",                                        // a Stripe Payment Link, no platform fee
    paypal:    "",
    email:     "verma1997@gmail.com"                      // always rendered as a fallback
  },

  // Your main site / the repos people came from.
  home: "https://github.com/RitwickVerma",

  funds: [
    { icon:"🕒", title:"Time",       body:"Mostly the hours that go into maintaining things after the fun part is done — issues, dependency bumps, reviews." },
    { icon:"🧰", title:"Tools",      body:"Hardware and services the projects actually need to be tested on real machines instead of assumed to work." },
    { icon:"📚", title:"Docs",       body:"Turning a project that only I understand into one somebody else can pick up without asking me." }
  ],

  // Keep these honest — a tip that promises nothing is easier to trust.
  tiers: [
    { icon:"☕", amount:"$5",   per:"one-off",  what:"A coffee. Genuinely the whole idea." },
    { icon:"🍕", amount:"$15",  per:"one-off",  what:"Dinner. Buys a solid evening of maintenance." },
    { icon:"🛠️", amount:"$5",   per:"per month", what:"Sustainer. Steadies the boring upkeep work." },
    { icon:"✨", amount:"Custom", per:"your call", what:"Anything at all — every bit is read and appreciated." }
  ],

  supporters: [] // e.g. ["@someone", "A kind stranger"] — leave empty until you have permission
};
/* ======================= nothing to edit below here ======================= */

/* NOTE ON innerHTML: every string interpolated below comes from the CONFIG object at the
   top of this file — author-controlled literals committed to the repo. This is a static
   page with no user input, no query params and no network reads, so there is no untrusted
   source to inject. If you later make any of this dynamic (e.g. fetching a supporter list
   from an API), switch those interpolations to textContent or sanitise first. */
const $ = (id) => document.getElementById(id);
const has = (k) => CONFIG.links[k] && CONFIG.links[k].trim() !== "";

/* ---- hero ---- */
$("who").textContent = CONFIG.name.split(" ")[0] + "'s";
$("lede").textContent = CONFIG.lede;
$("hint").textContent = CONFIG.hint;
$("home").href = CONFIG.home;
$("privacy").textContent = "No analytics, no cookies, no external requests — this page is one static file.";

/* ---- channels model: one place that knows how each channel behaves ---- */
const CHANNELS = [
  { key:"sponsors",  icon:"💜", label:"GitHub Sponsors", note:"Recurring or one-off, on GitHub",   fee:"0% platform",  tiered:true  },
  { key:"kofi",      icon:"☕", label:"Ko-fi",           note:"Fastest to set up, card or PayPal", fee:"0% platform",  tiered:false },
  { key:"liberapay", icon:"🔁", label:"Liberapay",       note:"Recurring, non-profit run",         fee:"0% fees",      tiered:false },
  { key:"stripe",    icon:"💳", label:"Card / Apple Pay", note:"Straight to me via Stripe",        fee:"~3% processor", tiered:true },
  { key:"paypal",    icon:"🅿️", label:"PayPal",          note:"One-off, whatever you have",        fee:"processor",    tiered:false }
];

const live = CHANNELS.filter(c => has(c.key));

/* primary CTAs: prefer sponsors, else kofi, else stripe, else the first live one */
const primary = live.find(c => c.key === "sponsors") || live.find(c => c.key === "kofi") || live.find(c => c.key === "stripe") || live[0];

if (primary) {
  const a = document.createElement("a");
  a.className = "btn primary";
  a.href = CONFIG.links[primary.key];
  a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = `<span aria-hidden="true">${primary.icon}</span> Support on ${primary.label}`;
  $("cta").appendChild(a);
}

if (CONFIG.links.email) {
  const m = document.createElement("a");
  m.className = "btn";
  m.href = "mailto:" + CONFIG.links.email + "?subject=" + encodeURIComponent("Supporting your open source");
  m.innerHTML = '<span aria-hidden="true">✉️</span> Ask me something first';
  $("cta").appendChild(m);
}

/* ---- funds ---- */
$("funds").innerHTML = CONFIG.funds.map(f => `
  <div class="card"><span class="icon" aria-hidden="true">${f.icon}</span>
  <h3>${f.title}</h3><p>${f.body}</p></div>`).join("");

/* ---- tiers: link each tier to a channel that can express that amount ---- */
$("tiers").innerHTML = CONFIG.tiers.map(t => {
  const target = (live.find(c => c.tiered) || live[0]);
  const href = target ? CONFIG.links[target.key] : "#channels";
  const ext = target ? ' target="_blank" rel="noopener"' : "";
  return `<div class="card tier">
      <span class="icon" aria-hidden="true">${t.icon}</span>
      <div class="amt">${t.amount}</div>
      <div class="per">${t.per}</div>
      <p class="what">${t.what}</p>
      <a class="btn" href="${href}"${ext}>${target ? "Contribute" : "Set up a channel"}</a>
    </div>`;
}).join("");

/* ---- channels ---- */
$("channels").innerHTML = live.map(c => `
  <a class="chan" href="${CONFIG.links[c.key]}" target="_blank" rel="noopener">
    <span class="dot" aria-hidden="true">${c.icon}</span>
    <span class="meta"><b>${c.label}</b><span>${c.note}</span></span>
    <span class="fee">${c.fee}</span>
  </a>`).join("");

if (!live.length) {
  $("setup").hidden = false;
  $("setup").innerHTML = "No donation channel is configured yet. Fill in <code>CONFIG.links</code> at the top of this file — " +
    "any channel left as <code>\"\"</code> stays hidden, so you can enable them one at a time.";
}

/* ---- supporters ---- */
$("wall").innerHTML = CONFIG.supporters.length
  ? CONFIG.supporters.map(s => `<span>${s}</span>`).join("")
  : '<span class="empty">Nobody yet — first name goes here (with their permission).</span>';

/* ---- reveal on scroll ---- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) {
  document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
} else {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
      if (e.isIntersecting) { setTimeout(() => e.target.classList.add("in"), i * 70); io.unobserve(e.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
}
</script>
</body>
</html>
