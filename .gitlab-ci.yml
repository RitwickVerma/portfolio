stages:
  - check
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  # Keep npm's package cache inside the project dir so GitLab can cache it.
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

# Shared cache: npm's package cache (`.npm`) keyed on package-lock.json.
# `npm ci --prefer-offline` reads tarballs from here instead of the network.
default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

# ── Lint ──────────────────────────────────
lint:
  stage: check
  image: node:${NODE_VERSION}
  script:
    - npm ci --prefer-offline
    - npm run lint

# ── TypeScript type check ─────────────────
typecheck:
  stage: check
  image: node:${NODE_VERSION}
  script:
    - npm ci --prefer-offline
    - npx tsc --noEmit

# ── Unit tests (Vitest) ───────────────────
test:
  stage: check
  image: node:${NODE_VERSION}
  script:
    - npm ci --prefer-offline
    - npm run test

# ── Build + install prod deps ─────────────
build:
  stage: build
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .next/cache/
  artifacts:
    paths:
      - .next/
      - public/
      - node_modules/
      - package.json
      - next.config.ts
    expire_in: 1h
  script:
    - npm ci --prefer-offline
    - npm run build
    - npm prune --omit=dev

# ── Deploy to CT114 ──
deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - lint
    - typecheck
    - build
  only:
    - master
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H 69.69.69.114 >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - tar czf /tmp/deploy.tar.gz .next public node_modules package.json next.config.ts
    - scp -o StrictHostKeyChecking=no /tmp/deploy.tar.gz root@69.69.69.114:/tmp/pf-deploy.tar.gz
    - ssh -o StrictHostKeyChecking=no root@69.69.69.114 '
        cd /opt/portfolio &&
        rm -rf .next public node_modules &&
        tar xzf /tmp/pf-deploy.tar.gz &&
        systemctl restart portfolio &&
        sleep 3 &&
        curl -sk -o /dev/null -w "%{http_code}" http://localhost:3456/
      '
