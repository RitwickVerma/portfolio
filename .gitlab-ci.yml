stages:
  - check
  - build
  - release
  - deploy

variables:
  NODE_VERSION: "22"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  ARTIFACT: "portfolio-standalone.tar.gz"

# Shared npm cache, keyed on lockfile
default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

# ── Checks — every push (cheap, no build) ──────────────────────────────
lint:
  stage: check
  image: node:${NODE_VERSION}
  script:
    - npm ci --prefer-offline
    - npm run lint

typecheck:
  stage: check
  image: node:${NODE_VERSION}
  script:
    - npm ci --prefer-offline
    - npx tsc --noEmit

test:
  stage: check
  image: node:${NODE_VERSION}
  script:
    - npm ci --prefer-offline
    - npm run test

# ── Build — tags only → self-contained standalone tarball ───────────────
build:
  stage: build
  image: node:${NODE_VERSION}
  rules:
    - if: $CI_COMMIT_TAG
  cache:
    # Two SEPARATE caches. The npm tarball cache shares its key with the check
    # jobs (keyed on lockfile). The turbopack build cache gets its own stable
    # key so lint/typecheck/test jobs (which only cache .npm) can't overwrite
    # and drop .next/cache — that was why "No build cache found" every time.
    - key:
        files:
          - package-lock.json
      paths:
        - .npm/
    - key: turbopack
      paths:
        - .next/cache/
  script:
    - npm ci --prefer-offline
    - npm run build
    # standalone output needs static + public copied in by hand
    - cp -r .next/static .next/standalone/.next/static
    - cp -r public .next/standalone/public
    - tar czf ${ARTIFACT} -C .next/standalone .
    # Publish a permanent, versioned artifact to the generic package registry
    - |
      curl -f --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file ${ARTIFACT} \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/portfolio/${CI_COMMIT_TAG}/${ARTIFACT}"
  artifacts:
    paths:
      - ${ARTIFACT}
    expire_in: never

# ── Release — tags only → versioned GitLab Release ──────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Releasing ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Portfolio release ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "portfolio-standalone.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/portfolio/${CI_COMMIT_TAG}/${ARTIFACT}"

# ── Deploy — tags only → ship the prebuilt tarball to CT114 ─────────────
deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H 69.69.69.114 >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - scp -o StrictHostKeyChecking=no ${ARTIFACT} root@69.69.69.114:/tmp/pf-deploy.tar.gz
    - ssh -o StrictHostKeyChecking=no root@69.69.69.114 '
        cd /opt/portfolio &&
        systemctl stop portfolio &&
        rm -rf .next public node_modules server.js package.json next.config.ts &&
        tar xzf /tmp/pf-deploy.tar.gz &&
        systemctl start portfolio &&
        sleep 3 &&
        curl -sk -o /dev/null -w "%{http_code}" http://localhost:3456/
      '
