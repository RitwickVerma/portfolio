stages:
  - check

variables:
  NODE_VERSION: "22"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

# One job, one npm ci. Lint + typecheck + test together. No build, no deploy —
# deployment is `./deploy.sh` from the dev box.
check:
  stage: check
  image: node:${NODE_VERSION}
  script:
    - npm ci --prefer-offline
    - npm run lint
    - npx tsc --noEmit
    - npm run test
