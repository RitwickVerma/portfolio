# Build once, test those bytes, deploy those bytes.
#
#   build   npm ci + next build (prebuild refreshes liveness) + the SEO audit over the export; out/ is the artifact
#   check   lint + typecheck + unit tests, beside build (none of them needs the export)
#   e2e     Playwright over build's out/, one job per engine so the three run side by side on the runner and a
#           webkit flake is retried alone (was one job: 837 tests, 2 workers, ~11 min)
#   deploy  master only: wrangler uploads build's out/, the exact export the browsers just passed
#           (it used to run its own npm ci + next build on a different Node than the one e2e tested)
stages: [build, test, deploy]

variables:
  NODE_IMAGE: node:22
  # Must match @playwright/test in package.json.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

default:
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull

build:
  stage: build
  image: $NODE_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push # the one job that refreshes the npm cache
  script:
    - npm ci --prefer-offline
    - npm run build
    # Every page's title, description, canonical, card and structured data, read from the export.
    - node tools/seo-audit.mjs
  artifacts:
    expire_in: 1 week
    # prebuild (tools/liveness.mjs) refetches liveness.generated.json and the export is built from it;
    # e2e/liveness.spec.ts reads the same file to check the page, so it must get THIS copy, not the
    # one committed in git (they differed as soon as a project's CI status changed: all engines red).
    paths: [out/, src/lib/liveness.generated.json]

check:
  stage: build
  image: $NODE_IMAGE
  script:
    - npm ci --prefer-offline
    - npm run lint
    - npx tsc --noEmit
    - npm run test

e2e:
  stage: test
  image: $PLAYWRIGHT_IMAGE
  needs: [build]
  parallel:
    matrix:
      - BROWSER: [chromium, firefox, webkit]
  script:
    - npm ci --prefer-offline
    - npx playwright test --project="$BROWSER"
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths: [e2e-results/]
    reports:
      junit: e2e-results/junit.xml

# Deploys build's out/ to Cloudflare Pages (since 2026-10-16; CT114 nginx no longer serves
# www.ritwickverma.dev). CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are masked+protected CI/CD variables.
# wrangler is pinned: an unpinned `npx wrangler` fetched whatever npm called latest on each deploy.
deploy:
  stage: deploy
  image: $NODE_IMAGE
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  needs: [build, check, e2e]
  script:
    - test -f out/index.html
    - npx --yes wrangler@4.160.1 pages deploy out --project-name=portfolio --branch=master --commit-dirty=true
