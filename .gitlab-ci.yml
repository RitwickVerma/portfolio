stages:
  - check
  - build
  - deploy

variables:
  NODE_VERSION: "22"

# ── Lint ──────────────────────────────────
lint:
  stage: check
  image: node:${NODE_VERSION}
  cache:
    key: npm-lint-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run lint

# ── TypeScript type check ─────────────────
typecheck:
  stage: check
  image: node:${NODE_VERSION}
  cache:
    key: npm-tc-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  script:
    - npm ci
    - npx tsc --noEmit

# ── Build ─────────────────────────────────
build:
  stage: build
  image: node:${NODE_VERSION}
  cache:
    key: npm-build-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .next/cache/
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - next.config.ts
    expire_in: 1h
  script:
    - npm ci
    - npm run build

# ── Deploy to CT114 ──
deploy:
  stage: deploy
  image: ubuntu:22.04
  needs:
    - lint
    - typecheck
    - build
  only:
    - master
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client rsync >/dev/null 2>&1
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H 69.69.69.114 >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - tar czf /tmp/deploy.tar.gz --exclude='node_modules' --exclude='.git' .next public package.json package-lock.json next.config.ts
    - scp -o StrictHostKeyChecking=no /tmp/deploy.tar.gz root@69.69.69.114:/tmp/pf-deploy.tar.gz
    - ssh -o StrictHostKeyChecking=no root@69.69.69.114 '
        cd /opt/portfolio &&
        rm -rf .next public &&
        tar xzf /tmp/pf-deploy.tar.gz &&
        npm ci --omit=dev --silent &&
        systemctl restart portfolio &&
        sleep 3 &&
        curl -sk -o /dev/null -w "%{http_code}" http://localhost:3456/
      '
