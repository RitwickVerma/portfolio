stages:
  - check
  - deploy

variables:
  NODE_VERSION: "22"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

# One job, one npm ci — lint + typecheck + test together.
check:
  stage: check
  image: node:${NODE_VERSION}
  script:
    - npm ci --prefer-offline
    - npm run lint
    - npx tsc --noEmit
    - npm run test

# Browser smoke tests over the built export, in the image that carries all
# three engines. The image tag must match @playwright/test in package.json.
e2e:
  stage: check
  image: mcr.microsoft.com/playwright:v1.65.0-noble
  script:
    - npm ci --prefer-offline
    - npm run build
    # Every page's title, description, canonical, card and structured data, read from the export.
    - node tools/seo-audit.mjs
    - npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - e2e-results/
    reports:
      junit: e2e-results/junit.xml

# Builds the static export here in CI and deploys it to Cloudflare Pages.
# Replaced the old SSH-to-CT114/rebuild.sh path on 2026-10-16 (migration to
# Cloudflare Pages) -- CT114 nginx is no longer the serving origin for
# www.ritwickverma.dev. CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are
# masked+protected CI/CD variables.
deploy:
  stage: deploy
  image: node:${NODE_VERSION}
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  needs:
    - check
    - e2e
  script:
    - npm ci --prefer-offline
    - npm run build
    - npx wrangler pages deploy out --project-name=portfolio --branch=master --commit-dirty=true
